name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without v prefix, e.g., 4.6.1)'
        required: true
        type: string

jobs:
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-macos-${{ hashFiles('**/package-lock.json') }}
          restore-keys: electron-macos-

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install app dependencies
        run: npm install
        working-directory: release/app

      - name: Build DLL
        run: npm run build:dll

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Package
        env:
          CI: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Code signing certificate (base64-encoded .p12)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          npm run build
          npx electron-builder build --publish always

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ steps.version.outputs.version }}
          path: |
            release/build/*.dmg
            release/build/*.zip
            release/build/*.yml
          retention-days: 30

      - name: Setup GCS
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCS_SA_KEY }}

      - name: Upload versioned releases to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: release/build
          destination: okrapdf-public/releases/v${{ steps.version.outputs.version }}
          glob: '*.dmg'
          parent: false

      - name: Fix paths in auto-update manifest
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Update paths in latest-mac.yml to include version prefix
          sed -i '' "s|url: OkraPDF-|url: v${VERSION}/OkraPDF-|g" release/build/latest-mac.yml
          sed -i '' "s|path: OkraPDF-|path: v${VERSION}/OkraPDF-|g" release/build/latest-mac.yml
          cat release/build/latest-mac.yml

      - name: Upload auto-update manifest to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: release/build
          destination: okrapdf-public/releases
          glob: 'latest-mac.yml'
          parent: false

      - name: Summary
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "## Release v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download URLs (macOS)" >> $GITHUB_STEP_SUMMARY
          echo "| Arch | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Apple Silicon | https://okrapdf.com/download/desktop/v${VERSION}/OkraPDF-${VERSION}-arm64.dmg |" >> $GITHUB_STEP_SUMMARY
          echo "| Intel | https://okrapdf.com/download/desktop/v${VERSION}/OkraPDF-${VERSION}.dmg |" >> $GITHUB_STEP_SUMMARY

  build-windows:
    if: false  # Disabled - no Windows users yet. Remove this line when needed.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache Electron
        uses: actions/cache@v4
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: electron-windows-${{ hashFiles('**/package-lock.json') }}
          restore-keys: electron-windows-

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Install app dependencies
        run: npm install
        working-directory: release/app

      - name: Build DLL
        run: npm run build:dll

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Package
        env:
          CI: true
        run: npm run package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.version.outputs.version }}
          path: |
            release/build/*.exe
          retention-days: 30

      - name: Setup GCS
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCS_SA_KEY }}

      - name: Upload to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: release/build
          destination: okrapdf-public/releases/v${{ steps.version.outputs.version }}
          glob: '*.exe'
          parent: false

      - name: Summary
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "## Windows Release v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download URL" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows x64 | https://okrapdf.com/download/desktop/v${VERSION}/OkraPDF-Setup-${VERSION}.exe |" >> $GITHUB_STEP_SUMMARY
