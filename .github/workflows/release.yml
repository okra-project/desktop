name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (without v prefix, e.g., 4.6.1)'
        required: true
        type: string
      arch:
        description: 'Architecture to build'
        required: false
        type: choice
        options:
          - arm64
          - universal
        default: arm64
      skip_notarization:
        description: 'Skip notarization (faster, for testing)'
        required: false
        type: boolean
        default: false

# Cancel redundant builds on same ref
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    # Use M1 runner - faster for arm64 builds
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Cache electron binaries AND node_modules together
      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            release/app/node_modules
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: deps-macos-${{ hashFiles('package-lock.json', 'release/app/package-lock.json') }}
          restore-keys: deps-macos-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          npm install --ignore-scripts
          cd release/app && npm install

      # Skip DLL build in CI - not needed for production builds
      # DLL is only for dev hot-reload optimization

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Determine arch flag
        id: arch
        run: |
          ARCH="${{ inputs.arch || 'arm64' }}"
          if [ "$ARCH" = "arm64" ]; then
            echo "flag=--arm64" >> $GITHUB_OUTPUT
          else
            echo "flag=" >> $GITHUB_OUTPUT
          fi

      - name: Build and Package
        env:
          CI: true
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Skip notarization if requested (saves ~3-5 min)
          SKIP_NOTARIZATION: ${{ inputs.skip_notarization || 'false' }}
        run: |
          npm run build

          if [ "$SKIP_NOTARIZATION" = "true" ]; then
            echo "Skipping notarization..."
            npx electron-builder build ${{ steps.arch.outputs.flag }} --publish never
          else
            npx electron-builder build ${{ steps.arch.outputs.flag }} --publish always
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-dmg-${{ steps.version.outputs.version }}
          path: |
            release/build/*.dmg
            release/build/*.zip
            release/build/*.yml
            release/build/*.blockmap
          retention-days: 30

      - name: Setup GCS
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCS_SA_KEY }}

      - name: Upload versioned releases to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: release/build
          destination: okrapdf-public/releases/v${{ steps.version.outputs.version }}
          glob: '*.{dmg,zip}'
          parent: false

      - name: Fix paths in auto-update manifest
        run: |
          VERSION=${{ steps.version.outputs.version }}
          sed -i '' "s|url: OkraPDF-|url: v${VERSION}/OkraPDF-|g" release/build/latest-mac.yml
          sed -i '' "s|path: OkraPDF-|path: v${VERSION}/OkraPDF-|g" release/build/latest-mac.yml
          cat release/build/latest-mac.yml

      - name: Upload auto-update manifest to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: release/build
          destination: okrapdf-public/releases
          glob: 'latest-mac.yml'
          parent: false

      - name: Summary
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "## Release v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download URLs (macOS)" >> $GITHUB_STEP_SUMMARY
          echo "| Arch | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Apple Silicon | https://okrapdf.com/download/desktop/v${VERSION}/OkraPDF-${VERSION}-arm64.dmg |" >> $GITHUB_STEP_SUMMARY
          echo "| Intel | https://okrapdf.com/download/desktop/v${VERSION}/OkraPDF-${VERSION}.dmg |" >> $GITHUB_STEP_SUMMARY

  build-windows:
    if: false  # Disabled - no Windows users yet
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Cache dependencies
        uses: actions/cache@v4
        id: cache-deps
        with:
          path: |
            node_modules
            release/app/node_modules
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
          key: deps-windows-${{ hashFiles('package-lock.json', 'release/app/package-lock.json') }}
          restore-keys: deps-windows-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          npm install --ignore-scripts
          cd release/app && npm install

      - name: Determine version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT
          else
            echo "version=${{ inputs.version }}" >> $GITHUB_OUTPUT
          fi

      - name: Build and Package
        env:
          CI: true
        run: npm run package

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-${{ steps.version.outputs.version }}
          path: |
            release/build/*.exe
          retention-days: 30

      - name: Setup GCS
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCS_SA_KEY }}

      - name: Upload to GCS
        uses: google-github-actions/upload-cloud-storage@v2
        with:
          path: release/build
          destination: okrapdf-public/releases/v${{ steps.version.outputs.version }}
          glob: '*.exe'
          parent: false

      - name: Summary
        shell: bash
        run: |
          VERSION=${{ steps.version.outputs.version }}
          echo "## Windows Release v${VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download URL" >> $GITHUB_STEP_SUMMARY
          echo "| Platform | URL |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-----|" >> $GITHUB_STEP_SUMMARY
          echo "| Windows x64 | https://okrapdf.com/download/desktop/v${VERSION}/OkraPDF-Setup-${VERSION}.exe |" >> $GITHUB_STEP_SUMMARY
